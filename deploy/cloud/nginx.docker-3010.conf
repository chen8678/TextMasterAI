# 用于 Docker 跑「第二套前端」：容器内监听 80，映射宿主机 3010:80
# 启动示例：
#   sudo docker run -d --name chen-ai-v3010-web --restart unless-stopped \
#     --add-host=host.docker.internal:host-gateway \
#     -p 3010:80 \
#     -v /opt/chen-ai-v3010/frontend-dist:/usr/share/nginx/html:ro \
#     -v /opt/chen-ai-v3010/nginx.docker-3010.conf:/etc/nginx/nginx.conf:ro \
#     nginx:alpine
#
# 后端须监听 0.0.0.0:8010（宿主机）。API 经 host.docker.internal 转发。

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 100M;
    client_body_timeout 120s;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /api/ {
            proxy_pass http://host.docker.internal:8010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
    }
}
