# 第二套环境：宿主机 Nginx 监听 3010，静态站点 + /api 反代到本机 Django 8010
# 用法：把 ROOT_PATH 换成实际前端静态目录（内含 index.html），拷贝到 /etc/nginx/conf.d/chen-ai-v3010.conf 后：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 若本机未安装 Nginx，可用 Docker（见 docs/CLOUD_PARALLEL_DEPLOY_V3010.md）。

server {
    listen 3010;
    server_name _;

    # TODO：改为云机上前端静态文件目录（SFTP 上传 deploy/offline-bundle/frontend-dist 的内容到此目录）
    root /opt/chen-ai-v3010/frontend-dist;
    index index.html;

    client_max_body_size 100M;
    client_body_timeout 120s;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
