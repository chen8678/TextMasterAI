# 智库体 (chen-AI-测试包) 一体化部署
# 用法: docker-compose up -d
# 访问: 前端 http://localhost:3009  后端 http://localhost:8000

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg15}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_qa_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 新建数据卷时自动启用 pgvector（已有数据卷若迁移失败需手动执行一次 CREATE EXTENSION vector）
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chen-ai-ceshi-backend
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      vectorization:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ai_qa_system}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DEBUG=${DEBUG:-False}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3009,http://127.0.0.1:3009}
      - VECTORIZATION_SERVICE_URL=http://vectorization:8001
      # 可选：与 docker-compose.celery.yml 同用时，在根目录 .env 设 CELERY_TASK_ALWAYS_EAGER=false 与 REDIS URL
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-true}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-memory://}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-cache+memory://}
      - ENGLISH_REMINDER_BEAT=${ENGLISH_REMINDER_BEAT:-}
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chen-ai-ceshi-frontend
    ports:
      - "3009:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  vectorization:
    build:
      context: ./services/vectorization
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${VECTORIZATION_BASE_IMAGE:-docker.1ms.run/library/python:3.11-slim-bookworm}
    image: text-master-vectorization:local
    ports:
      - "8001:8001"
    environment:
      - TRANSFORMERS_CACHE=/app/models
      - HF_HOME=/app/models
      - HF_HUB_CACHE=/app/models
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - vectorization_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 15s
      retries: 30
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 6G

  # P3-T22（可选）：启用独立队列/worker 隔离 PRO 沙盒任务。
  # 使用方式：docker compose --profile pro-worker up -d redis pro-worker
  redis:
    image: redis:7-alpine
    profiles: ["pro-worker"]
    ports:
      - "6379:6379"

  pro-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chen-ai-ceshi-backend
    profiles: ["pro-worker"]
    command: ["celery", "-A", "ai_qa_system", "worker", "-Q", "pro_sandbox", "--concurrency=1", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ai_qa_system}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DEBUG=${DEBUG:-False}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3009,http://127.0.0.1:3009}
      - VECTORIZATION_SERVICE_URL=http://vectorization:8001
      - CELERY_TASK_ALWAYS_EAGER=false
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - CELERY_PRO_SANDBOX_QUEUE=${CELERY_PRO_SANDBOX_QUEUE:-pro_sandbox}
    volumes:
      - ./backend:/app
      - media_volume:/app/media

volumes:
  postgres_data:
  media_volume:
  vectorization_models:
